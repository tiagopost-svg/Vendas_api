<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM SaaS | Detalhe do cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="dashboard-page">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container-fluid px-4">
        <span class="navbar-brand fw-semibold">CRM SaaS</span>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
          <a href="clientes.html" class="btn btn-outline-light btn-sm">Clientes</a>
          <a href="visitas.html" class="btn btn-outline-light btn-sm">Visitas</a>
          <a href="orcamentos.html" class="btn btn-outline-light btn-sm">Orçamentos</a>
          <a href="vendas.html" class="btn btn-outline-light btn-sm">Vendas</a>
          <a href="followups.html" class="btn btn-outline-light btn-sm">Follow-ups</a>
          <a href="notificacoes.html" class="btn btn-light btn-sm position-relative">
            🔔
            <span id="navbarNotificacoesCount" class="badge rounded-pill text-bg-danger navbar-notification-badge d-none">0</span>
          </a>
          <span class="badge bg-light text-primary" id="empresaBadge">Empresa</span>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div id="clienteMensagem" class="alert d-none" role="alert"></div>

      <section class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
            <div>
              <p class="text-uppercase text-primary fw-semibold small mb-2">Ficha do cliente</p>
              <h1 class="h3 mb-1" id="clienteNome">Carregando...</h1>
              <p class="text-muted mb-0" id="clienteResumo">Aguarde enquanto carregamos os dados do cliente.</p>
            </div>
            <a href="clientes.html" class="btn btn-outline-primary">Voltar para clientes</a>
          </div>
          <div class="row g-3 mt-3" id="clienteInfoGrid"></div>
        </div>
      </section>

      <section class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-3">
            <div>
              <h2 class="h4 mb-1">Timeline do cliente</h2>
              <p class="text-muted small mb-0">Histórico completo em ordem cronológica com detalhes expansíveis.</p>
            </div>
            <button type="button" class="btn btn-outline-primary btn-sm" id="recarregarTimeline">Atualizar</button>
          </div>
          <div id="timelineLista" class="timeline-list">
            <div class="text-center text-muted py-4">Carregando timeline...</div>
          </div>
        </div>
      </section>
    </main>

    <script src="js/cliente_detalhe.js"></script>
    <script src="js/navbar.js"></script>
  </body>
</html>
