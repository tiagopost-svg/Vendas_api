<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM SaaS | Visitas de Campo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="dashboard-page">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container-fluid px-3 px-md-4">
        <span class="navbar-brand fw-semibold">CRM SaaS</span>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
          <a href="clientes.html" class="btn btn-outline-light btn-sm">Clientes</a>
          <a href="vendas.html" class="btn btn-outline-light btn-sm">Vendas</a><a href="orcamentos.html" class="btn btn-outline-light btn-sm">Orçamentos</a>
          <a href="followups.html" class="btn btn-outline-light btn-sm">Follow-ups</a>
          <a href="notificacoes.html" class="btn btn-light btn-sm position-relative">
            🔔
            <span id="navbarNotificacoesCount" class="badge rounded-pill text-bg-danger navbar-notification-badge d-none">0</span>
          </a>
          <span class="badge bg-light text-primary" id="empresaBadge">Empresa</span>
        </div>
      </div>
    </nav>

    <main class="container py-3 py-md-4">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <h1 class="h4 mb-2">Visita de campo</h1>
              <p class="text-muted small">Fluxo rápido para registrar desenho em caderno e foto do local em menos de 1 minuto.</p>
              <form id="visitaForm">
                <div class="mb-3">
                  <label for="cliente_id" class="form-label">Cliente</label>
                  <select id="cliente_id" class="form-select" required>
                    <option value="">Selecione um cliente</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="data_visita" class="form-label">Data da visita</label>
                  <input type="date" class="form-control" id="data_visita" required />
                </div>
                <div class="mb-3">
                  <label for="tipo_visita" class="form-label">Tipo da visita</label>
                  <select id="tipo_visita" class="form-select" required>
                    <option value="orcamento">Orçamento</option>
                    <option value="manutencao">Manutenção</option>
                    <option value="pos_venda">Pós-venda</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="imagem_desenho" class="form-label">Foto do desenho/caderno</label>
                  <input type="file" class="form-control" id="imagem_desenho" accept="image/*" capture="environment" required />
                </div>
                <div class="mb-3">
                  <label for="imagem_local" class="form-label">Foto do local (opcional)</label>
                  <input type="file" class="form-control" id="imagem_local" accept="image/*" capture="environment" />
                </div>
                <div class="mb-3">
                  <label for="resultado" class="form-label">Resultado</label>
                  <select id="resultado" class="form-select" required>
                    <option value="orcamento">Orçamento</option>
                    <option value="venda">Venda</option>
                    <option value="sem_interesse">Sem interesse</option>
                    <option value="retorno">Retorno</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="observacoes" class="form-label">Observações</label>
                  <textarea id="observacoes" class="form-control" rows="4"></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Salvar visita</button>
              </form>
              <div id="visitasMensagem" class="alert mt-3 d-none" role="alert"></div>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="card border-0 shadow-sm">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 mb-0">Visitas registradas</h2>
                <button type="button" class="btn btn-outline-primary btn-sm" id="recarregarVisitas">Atualizar</button>
              </div>
              <div id="visitasLista" class="row g-3">
                <div class="col-12 text-center text-muted py-4">Carregando visitas...</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/visitas.js"></script>
    <script src="js/navbar.js"></script>
  </body>
</html>
