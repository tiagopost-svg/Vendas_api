<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM SaaS | Notificações</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="dashboard-page">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container-fluid px-4">
        <span class="navbar-brand fw-semibold">CRM SaaS</span>
        <div class="d-flex align-items-center gap-2 flex-wrap">
          <a href="dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
          <a href="clientes.html" class="btn btn-outline-light btn-sm">Clientes</a>
          <a href="visitas.html" class="btn btn-outline-light btn-sm">Visitas</a>
          <a href="orcamentos.html" class="btn btn-outline-light btn-sm">Orçamentos</a>
          <a href="vendas.html" class="btn btn-outline-light btn-sm">Vendas</a>
          <a href="followups.html" class="btn btn-outline-light btn-sm">Follow-ups</a>
          <a href="notificacoes.html" class="btn btn-light btn-sm position-relative">
            🔔
            <span id="navbarNotificacoesCount" class="badge rounded-pill text-bg-danger navbar-notification-badge d-none">0</span>
          </a>
          <span class="badge bg-light text-primary" id="empresaBadge">Empresa</span>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <section class="row g-3 mb-4">
        <div class="col-md-6 col-xl-3">
          <div class="card border-0 shadow-sm h-100 dashboard-stat-card">
            <div class="card-body">
              <p class="text-muted mb-2 small">Não lidas</p>
              <h2 class="fw-bold mb-0" id="naoLidasCount">0</h2>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-xl-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <label for="filtroLeitura" class="form-label small text-muted mb-2">Exibição</label>
              <select id="filtroLeitura" class="form-select">
                <option value="todas" selected>Todas</option>
                <option value="nao_lidas">Somente não lidas</option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-xl-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body">
              <label for="filtroTipo" class="form-label small text-muted mb-2">Tipo</label>
              <select id="filtroTipo" class="form-select">
                <option value="">Todos</option>
                <option value="followup">Follow-up</option>
                <option value="visita">Visita</option>
                <option value="venda">Venda</option>
                <option value="sistema">Sistema</option>
              </select>
            </div>
          </div>
        </div>
        <div class="col-md-6 col-xl-3">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-body d-flex flex-column justify-content-end gap-2">
              <button type="button" class="btn btn-outline-primary btn-sm" id="recarregarNotificacoes">Atualizar</button>
            </div>
          </div>
        </div>
      </section>

      <div id="notificacoesMensagem" class="alert d-none" role="alert"></div>

      <section class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-3">
            <div>
              <h1 class="h4 mb-1">Notificações inteligentes</h1>
              <p class="text-muted small mb-0">Alertas automáticos de follow-up, visitas, vendas e clientes inativos.</p>
            </div>
          </div>
          <div id="notificacoesLista" class="d-grid gap-3">
            <div class="text-center text-muted py-4">Carregando notificações...</div>
          </div>
        </div>
      </section>
    </main>

    <script src="js/navbar.js"></script>
    <script src="js/notificacoes.js"></script>
  </body>
</html>
